<div class="convergence-chart-container">
  <div class="chart-header">
    <h3 class="section-title">
      <mat-icon>show_chart</mat-icon>
      Real-time Convergence
    </h3>

    <div class="best-trial" *ngIf="getBestTrial() as best">
      <mat-icon>emoji_events</mat-icon>
      <span class="label">Best:</span>
      <span class="trial-name">{{ best.trialName }}</span>
      <span class="metric-value">{{ best.metricValue?.toFixed(6) }}</span>
    </div>
  </div>

  <div
    class="chart-wrapper"
    *ngIf="trialsProgress?.length > 0 && chartOptions.series"
  >
    <div
      echarts
      [options]="chartOptions"
      [initOpts]="initOpts"
      class="chart"
    ></div>
  </div>

  <div
    class="no-data"
    *ngIf="!trialsProgress?.length || !chartOptions.series"
  >
    <mat-icon>analytics</mat-icon>
    <span>Waiting for metric data from trials...</span>
    <p class="hint">
      Metrics will appear here as trials report their training progress.
    </p>
  </div>
</div>
