<div class="trials-progress-container" *ngIf="sortedTrials?.length > 0">
  <h3 class="section-title">
    <mat-icon>trending_up</mat-icon>
    Training Progress
  </h3>

  <div class="trials-list">
    <div
      *ngFor="let trial of sortedTrials; trackBy: trackByTrialName"
      class="trial-card"
      [class]="getStatusClass(trial.status)"
    >
      <div class="trial-header">
        <div class="trial-name">
          <mat-icon [class]="getStatusClass(trial.status)">
            {{ getStatusIcon(trial.status) }}
          </mat-icon>
          <span class="name">{{ trial.trialName }}</span>
        </div>
        <div class="trial-metrics">
          <span class="metric-value" *ngIf="trial.currentObjectiveValue">
            {{ trial.currentObjectiveValue }}
          </span>
          <span class="progress-percent">{{ trial.progressPercentage }}%</span>
        </div>
      </div>

      <mat-progress-bar
        [mode]="trial.status === 'Running' ? 'buffer' : 'determinate'"
        [value]="trial.progressPercentage"
        [bufferValue]="trial.progressPercentage + 5"
        [color]="getProgressColor(trial.progressPercentage)"
      ></mat-progress-bar>

      <div class="trial-footer">
        <span class="status-badge" [class]="getStatusClass(trial.status)">
          {{ trial.status }}
        </span>
      </div>
    </div>
  </div>

  <div class="no-progress" *ngIf="sortedTrials?.length === 0">
    <mat-icon>hourglass_empty</mat-icon>
    <span>No training progress data available</span>
  </div>
</div>
